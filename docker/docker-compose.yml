services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cognivault-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cognivault

    volumes:
      - postgres-data:/var/lib/postgresql/data
 
volumes:
  postgres-data: